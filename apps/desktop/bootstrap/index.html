<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaoTa</title>
    <style>
      :root { color-scheme: light; }
      html, body { height: 100%; margin: 0; background: #f5f6f8; overflow: hidden; }
      body {
        font: 14px/1.7 ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #4a5568;
      }
      #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; visibility: hidden; background: #f5f6f8; }
      #splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      }
      .box { width: 560px; max-width: calc(100vw - 48px); text-align: center; }
      .dot {
        width: 28px; height: 28px; margin: 0 auto 16px;
        border: 3px solid #dfe4ea; border-top-color: #6c8cff; border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .title { font-size: 15px; color: #2d3748; }
      .detail { margin-top: 8px; font-size: 12.5px; color: #8a94a6; min-height: 20px; }
      .card {
        text-align: left; background: #fff; border: 1px solid #e6e9ef; border-radius: 10px;
        padding: 22px 24px; box-shadow: 0 6px 24px rgba(31, 43, 61, 0.06);
      }
      .card h1 { margin: 0 0 10px; font-size: 16px; color: #c0392b; }
      .card p { margin: 0 0 12px; }
      .card pre {
        margin: 0 0 12px; padding: 10px 12px; background: #f7f8fa; border-radius: 6px;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
        color: #4a5568; white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow: auto;
      }
      .card .path { font-size: 12px; color: #8a94a6; word-break: break-all; }
    </style>
  </head>
  <body>
    <iframe id="frame" title="MaoTa"></iframe>
    <div id="splash">
      <div class="box" id="box">
        <div class="dot"></div>
        <div class="title">正在启动 MaoTa…</div>
        <div class="detail" id="detail">准备中</div>
      </div>
    </div>
    <script>
      const frame = document.getElementById("frame");
      const splash = document.getElementById("splash");
      const box = document.getElementById("box");
      const detail = document.getElementById("detail");

      window.maotaStatus = function (text) {
        detail.textContent = text;
      };

      window.maotaShow = function (url) {
        frame.onload = function () {
          splash.style.display = "none";
          frame.style.visibility = "visible";
        };
        frame.src = url;
      };

      window.maotaFail = function (title, message, logPath) {
        splash.style.display = "flex";
        frame.style.display = "none";
        box.className = "card";
        box.innerHTML = "";
        const heading = document.createElement("h1");
        heading.textContent = title;
        box.appendChild(heading);
        const body = document.createElement("p");
        body.textContent = "MaoTa 没有启动成功。下面这段信息可以直接发给我：";
        box.appendChild(body);
        const pre = document.createElement("pre");
        pre.textContent = message;
        box.appendChild(pre);
        if (logPath) {
          const path = document.createElement("div");
          path.className = "path";
          path.textContent = "日志：" + logPath;
          box.appendChild(path);
        }
      };
    </script>
  </body>
</html>
